[project]
name = "onelook"
version = "0.1.0"
description = "Modèle d'IA léger et embarquable qui analyse une image satellite en une seule passe et décide si elle mérite une alerte."
readme = "README.md"
license = "MIT"
authors = [{ name = "elfried96" }]
requires-python = ">=3.12,<3.13"
# Dépendances légères : données, indices, évaluation, inférence ONNX.
# PyTorch est dans le groupe « train », installé seulement sur Colab / Kaggle.
dependencies = [
    "numpy>=1.26",
    "rasterio>=1.3",
    "h5py>=3.10",
    "hdf5plugin>=4.4",
    "fsspec>=2024.2",
    "aiohttp>=3.9",
    "requests>=2.31",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "onnxruntime>=1.18",
    "pystac-client>=0.9.1",
    "pyproj>=3.8.0",
    "affine>=3.0.1",
    "planetary-computer>=1.0.0",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "ipykernel>=6.29", "nbconvert>=7.16"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5,<10"]
train = ["torch>=2.3", "torchvision>=0.18", "torchgeo>=0.6", "onnx>=1.16"]
demo = ["gradio>=4.0"]

[tool.uv]
default-groups = ["dev", "docs"]

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"
