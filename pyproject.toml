[project]
name = "onelook"
version = "0.1.0"
description = "Modèle d'IA léger et embarquable qui analyse une image satellite en une seule passe et décide si elle mérite une alerte."
readme = "README.md"
license = "MIT"
authors = [{ name = "elfried96" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    # Cœur du projet
    "torch>=2.3",
    "torchvision>=0.18",
    "torchgeo>=0.6",
    "rasterio>=1.3",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    # Allègement et inférence embarquée
    "onnx>=1.16",
    "onnxruntime>=1.18",
    # Démo
    "gradio>=4.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5,<10"]

[tool.uv]
default-groups = ["dev", "docs"]

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"
