# Lot « inconnu » : phénomènes que le modèle n'a jamais vus, ni en entraînement, ni en validation.
#
# Réponse attendue : « inconnu ». Une alerte (inondation ou incendie) ou « normal » est une erreur,
# à analyser : un modèle qui alerte sur une coulée de lave n'est pas absurde, il n'a pas le bon mot.
#
# Chaque événement donne une tuile de 512 × 512 pixels à 10 m (5,12 km de côté), centrée sur (lat, lon),
# prise au passage le moins nuageux de la fenêtre (start, end), après l'événement.
# Coordonnées approximatives du phénomène : chaque tuile est vérifiée à l'œil (planche de scripts/unknown_set.py sheet).
# visible : le phénomène se voit-il sur la tuile ? Seules les tuiles « oui » comptent pour conclure.

events:
  # --- Éruptions volcaniques : coulées de lave récentes, dépôts pyroclastiques ---------------
  - {name: la_palma_2021, lat: 28.615, lon: -17.900, category: eruption, start: 2022-01-01, end: 2022-03-31,
     note: "Cumbre Vieja (Canaries), coulées de sept. à déc. 2021",
     visible: "oui"}
  - {name: fagradalsfjall_2021, lat: 63.885, lon: -22.270, category: eruption, start: 2021-07-01, end: 2021-09-30,
     note: "Geldingadalir (Islande), coulée de mars à sept. 2021",
     visible: "oui"}
  - {name: nyiragongo_2021, lat: -1.580, lon: 29.230, category: eruption, start: 2021-06-01, end: 2021-08-31,
     note: "Coulée de mai 2021 vers Goma (RD Congo)",
     visible: "non (coulée non lisible : coordonnées à revoir)"}
  - {name: mauna_loa_2022, lat: 19.610, lon: -155.470, category: eruption, start: 2022-12-15, end: 2023-02-28,
     note: "Coulée de la zone de rift nord-est (Hawaï), nov.-déc. 2022",
     visible: "oui"}
  - {name: grindavik_2024, lat: 63.870, lon: -22.420, category: eruption, start: 2024-06-01, end: 2024-09-30,
     note: "Sundhnúkur (Islande), coulées de 2024 près de Grindavík",
     visible: "oui"}
  - {name: semeru_2021, lat: -8.150, lon: 112.950, category: eruption, start: 2021-12-10, end: 2022-03-31,
     note: "Semeru (Java), coulées pyroclastiques de déc. 2021",
