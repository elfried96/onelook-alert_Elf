# Catalogue des images « normales » : aucune inondation ni zone brûlée récente.
#
# Deux familles :
# - paysages variés, pour que le modèle connaisse le monde « ordinaire » ;
# - pièges, qui ressemblent à une anomalie sans en être une (voir la page Cadrage).
#
# Chaque site donne une tuile de 512 × 512 pixels à 10 m, centrée sur (lat, lon),
# prise sur la période indiquée. Sentinel-2 ne photographie la mer que jusqu'à ~20 km des côtes.
# clouds : clear = la moins nuageuse, cloudy = volontairement nuageuse.
# group : regroupe les sites proches pour le découpage entraînement / test (jamais de fuite entre groupes).

# years : une tuile par année, sur la même fenêtre saisonnière (les dates start / end donnent le jour et le mois).

defaults:
  start: 2021-01-01
  end: 2021-12-31
  clouds: clear
  years: [2019, 2020, 2021, 2022]

sites:
