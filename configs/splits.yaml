# Découpage entraînement / validation / test, par groupe : jamais par tuile au hasard.
# Un groupe entier (pays d'une inondation, zone CaBuAr, région pour les normales) va dans une seule partie,
# pour que l'évaluation porte sur des zones et des dates jamais vues.
#
# Inondations (groupe = pays de l'événement Sen1Floods11) :
#   test : Bolivie, Espagne, Sri Lanka (trois continents) · validation : Nigeria, Somalie
# Incendies (groupe = zone spatiale CaBuAr, calculée à l'indexation) : les plis CaBuAr ne servent pas, car
#   la même zone revient à plusieurs dates dans des plis différents (fuite constatée le 28 oct).
#   Les tuiles à moins de distance_km l'une de l'autre forment une zone ; chaque zone entière va dans une
#   partie, en visant les proportions ci-dessous de tuiles brûlées. Les images avant feu suivent leur zone.
#   Limite : tous les feux sont en Californie, y compris en test.
# Normales (groupe = région) : test = Asie du Sud, Australie, Himalaya, Californie du Sud ;
#   validation = Europe du Nord, Afrique de l'Est, Afrique australe, Moyen-Orient.

default: train

cabuar_zones:
  distance_km: 10
  ratios:
    train: 0.65
    val: 0.15
    test: 0.20

groups:
  test:
    - Bolivia
    - Spain
    - Sri-Lanka
    - asie_sud
    - australie
    - himalaya
    - californie_sud
  val:
    - Nigeria
    - Somalia
    - europe_nord
    - afrique_est
    - afrique_australe
    - moyen_orient
  train:
    - Ghana
    - India
    - Mekong
    - Pakistan
    - Paraguay
    - USA
    - amerique_sud
    - afrique_centrale
    - afrique_nord
    - afrique_ouest
    - europe_ouest
    - europe_est
    - amerique_nord
    - asie_centrale
    - asie_est
    - asie_sud_est
    - californie_nord
    - atlantique
